<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Wunschliste — MamaNeo</title>
<style>
  :root {
    --bg: #fdf6f7; --text: #3a3340; --muted: #7a6f80; --accent: #c48ba6;
    --card: #ffffff; --border: #eddfe4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1a20; --text: #ece6ee; --muted: #a99fb0; --accent: #d9a8c0;
      --card: #262229; --border: #3a3340;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.65; padding: 2rem 1rem 3rem;
  }
  main { max-width: 34rem; margin: 0 auto; }
  .marke {
    max-width: 34rem; margin: 0 auto .8rem; color: var(--accent);
    font-weight: 700; font-size: .8rem; letter-spacing: .03em; text-transform: uppercase;
  }
  h1 { color: var(--accent); font-size: 1.8rem; line-height: 1.25; overflow-wrap: anywhere; }
  .hinweis {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: .8rem 1rem; margin: 1.2rem 0;
    color: var(--muted); font-size: .92rem;
  }
  ul { list-style: none; margin: 1.4rem 0; }
  li {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: .85rem 1rem; margin-bottom: .6rem;
  }
  li.vergeben .name { text-decoration: line-through; color: var(--muted); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .name a { color: var(--accent); }
  .notiz, .vergabe { display: block; font-size: .88rem; color: var(--muted); margin-top: .15rem; overflow-wrap: anywhere; }
  .abstimmung { color: var(--muted); font-size: .92rem; margin-top: 1.6rem; }
  footer {
    margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--border);
    color: var(--muted); font-size: .85rem;
  }
  footer a { color: var(--muted); }
  .fehler h1 { color: var(--text); }
</style>
</head>
<body>
<!--
  Feste Kopfzeile: steht nicht aus den Daten, sondern fest im Quelltext. Ohne sie liesse
  sich mit einer gebastelten Nutzlast (z.B. Titel "MamaNeo — Konto bestaetigen" samt Link
  "Jetzt anmelden") eine echte Seite des Projekts nachahmen. Absichtlich ausserhalb von
  #inhalt, damit render()/fehler() sie nicht mit `wurzel.textContent = ''` mit-loeschen —
  sie erscheint dadurch auch auf der Fehlerseite.
-->
<header class="marke">MamaNeo &middot; geteilte Wunschliste</header>
<main id="inhalt">
  <noscript>
    <h1>Wunschliste</h1>
    <p>Für diese Seite wird JavaScript benötigt — die Liste steckt in der Adresse
    und wird erst im Browser lesbar gemacht.</p>
  </noscript>
</main>
<script>
(function (root) {
  'use strict';

  /**
   * Entschluesselt den `d`-Parameter. Gibt null zurueck, wenn er fehlt, unlesbar ist
   * oder nicht wie eine Wunschliste aussieht.
   *
   * Zwei Fallstricke, beide gemessen:
   * - Dart polstert base64url mit '='; Messenger schneiden die Polsterung mitunter ab.
   *   Deshalb wird sie hier immer neu ergaenzt.
   * - `atob` liefert Latin-1. Ohne den Umweg ueber TextDecoder wird aus "Gruesse"
   *   mit Umlaut ein Buchstabensalat.
   */
  function decodePayload(param) {
    if (!param) return null;
    try {
      var b64 = String(param).replace(/-/g, '+').replace(/_/g, '/');
      // Polsterung vorsorglich ergaenzen: `atob` vertraegt ihr Fehlen zwar von sich aus
      // (forgiving base64), strengere Umgebungen aber nicht. Dart liefert sie mit.
      while (b64.length % 4) b64 += '=';
      var binaer = atob(b64);
      var bytes = Uint8Array.from(binaer, function (z) { return z.charCodeAt(0); });
      var daten = JSON.parse(new TextDecoder('utf-8').decode(bytes));
      if (!daten || typeof daten.title !== 'string' || !Array.isArray(daten.items)) return null;
      // Die Nutzlast ist fremdbestimmt: Eintraege muessen Objekte mit Namen sein, und die
      // optionalen Textfelder muessen, falls vorhanden, auch Zeichenketten sein. Ohne das
      // koennte z.B. ein Objekt mit unbrauchbarem toString/valueOf als `note` mitkommen und
      // render() beim Aufbau eine Ausnahme werfen lassen — die Seite zeigte dann nur noch
      // die Ueberschrift, ohne Liste und ohne Fehlermeldung. Alles Unbrauchbare wird deshalb
      // hier schon verworfen, statt spaeter beim Aufbau eine Ausnahme zu riskieren.
      daten.items = daten.items.filter(function (a) {
        if (!a || typeof a !== 'object' || typeof a.name !== 'string') return false;
        return ['note', 'ageRecommendation', 'reservedByName'].every(function (feld) {
          return a[feld] == null || typeof a[feld] === 'string';
        });
      });
      return daten;
    } catch (e) {
      return null;
    }
  }

  /**
   * Entfernt Steuerzeichen fuer die Schreibrichtung (u.a. RTL-Override, Codepunkt U+202E)
   * aus fremdbestimmtem Text. Ohne das koennte ein Name, der ein solches Steuerzeichen
   * enthaelt, umgekehrt dargestellt werden und eine Adresse vortaeuschen.
   *
   * U+200C (ZWNJ) und U+200D (ZWJ) sind ABSICHTLICH ausgenommen: Sie sind keine
   * Steuerzeichen fuer die Schreibrichtung, sondern legitime Verbindungszeichen. ZWJ
   * setzt z.B. Familien-Emoji aus mehreren Einzelzeichen zusammen (Person+ZWJ+Person+...),
   * ZWNJ verhindert in manchen Schriftsystemen (u.a. Persisch) eine Buchstabenverbindung,
   * die sonst ein anderes Wort ergaebe. Wuerden sie hier mit entfernt, verfaelschte die
   * Saeuberung stillschweigend echte Artikelnamen, statt nur Angriffe abzuwehren — nicht
   * aufraeumen, dieser Bereich ist bewusst so eng gewaehlt.
   */
  function saeubern(text) {
    var s = String(text);
    var ergebnis = '';
    for (var i = 0; i < s.length; i++) {
      var code = s.charCodeAt(i);
      var istSteuerzeichen =
        (code >= 0x202A && code <= 0x202E) ||  // LRE, RLE, PDF, LRO, RLO
        (code >= 0x2066 && code <= 0x2069) ||  // LRI, RLI, FSI, PDI
        code === 0x200B ||                     // ZWSP
        code === 0x200E || code === 0x200F;    // LRM, RLM
      if (!istSteuerzeichen) ergebnis += s.charAt(i);
    }
    return ergebnis;
  }

  /** Laesst nur http/https durch — ein gebastelter Link darf kein Skript einschleusen. */
  function sichereAdresse(url) {
    if (!url) return null;
    try {
      var u = new URL(String(url));
      return (u.protocol === 'http:' || u.protocol === 'https:') ? String(url) : null;
    } catch (e) {
      return null;
    }
  }

  function knoten(tag, klasse, text) {
    var e = document.createElement(tag);
    if (klasse) e.className = klasse;
    if (text != null) e.textContent = saeubern(text);
    return e;
  }

  function render(daten, wurzel) {
    wurzel.textContent = '';
    wurzel.appendChild(knoten('h1', null, daten.title));

    if (daten.surpriseMode) {
      wurzel.appendChild(knoten('p', 'hinweis',
        'Diese Liste wurde im Überraschungsmodus geteilt: Wer bereits etwas übernommen hat, '
        + 'wird hier absichtlich nicht angezeigt. Ein Artikel kann also schon vergeben sein, '
        + 'auch wenn er in dieser Liste frei aussieht.'));
    }

    var liste = document.createElement('ul');
    daten.items.forEach(function (artikel) {
      var eintrag = knoten('li', artikel.isReserved ? 'vergeben' : null);
      var name = knoten('span', 'name');
      var adresse = sichereAdresse(artikel.affiliateUrl);
      if (adresse) {
        var a = knoten('a', null, artikel.name);
        a.href = adresse;
        a.rel = 'nofollow noopener noreferrer';
        name.appendChild(a);
      } else {
        name.textContent = saeubern(artikel.name);
      }
      eintrag.appendChild(name);
      if (artikel.note) eintrag.appendChild(knoten('span', 'notiz', artikel.note));
      if (artikel.ageRecommendation) {
        eintrag.appendChild(knoten('span', 'notiz', 'Ab ' + artikel.ageRecommendation));
      }
      if (artikel.isReserved) {
        eintrag.appendChild(knoten('span', 'vergabe', artikel.reservedByName
          ? 'Schon übernommen von ' + artikel.reservedByName
          : 'Schon übernommen'));
      }
      liste.appendChild(eintrag);
    });
    wurzel.appendChild(liste);

    wurzel.appendChild(knoten('p', 'abstimmung',
      'Du möchtest etwas davon schenken? Sag es der werdenden Mama — sie trägt es in '
      + 'ihrer App ein, damit nichts doppelt kommt.'));

    var fuss = document.createElement('footer');
    fuss.appendChild(knoten('span', null, 'Erstellt mit MamaNeo · '));
    var heim = knoten('a', null, 'Zur Übersicht');
    heim.href = '/mamaneo/';
    fuss.appendChild(heim);
    fuss.appendChild(knoten('span', null, ' · '));
    var ds = knoten('a', null, 'Datenschutz');
    ds.href = '/mamaneo/datenschutz';
    fuss.appendChild(ds);
    wurzel.appendChild(fuss);
  }

  function fehler(wurzel) {
    wurzel.textContent = '';
    wurzel.className = 'fehler';
    wurzel.appendChild(knoten('h1', null, 'Diese Wunschliste lässt sich nicht öffnen'));
    wurzel.appendChild(knoten('p', null,
      'Der Link ist unvollständig oder wurde beim Verschicken abgeschnitten. '
      + 'Bitte lass ihn dir noch einmal senden.'));
    var p = document.createElement('p');
    p.className = 'abstimmung';
    var a = knoten('a', null, 'Mehr über MamaNeo');
    a.href = '/mamaneo/';
    p.appendChild(a);
    wurzel.appendChild(p);
  }

  function start() {
    var wurzel = document.getElementById('inhalt');
    // Zweite Verteidigungslinie neben dem Filter in decodePayload: Sollte render() trotzdem
    // eine Ausnahme werfen, zeigt die Seite die Fehlerseite statt still nur die Ueberschrift
    // stehen zu lassen (leere Liste, keine Meldung).
    try {
      var param = new URL(window.location.href).searchParams.get('d');
      var daten = decodePayload(param);
      if (daten) { render(daten, wurzel); } else { fehler(wurzel); }
    } catch (e) {
      fehler(wurzel);
    }
  }

  root.MamaNeoWunschliste = {
    decodePayload: decodePayload,
    sichereAdresse: sichereAdresse,
    render: render
  };

  if (typeof document !== 'undefined') { start(); }
})(globalThis);
</script>
</body>
</html>
